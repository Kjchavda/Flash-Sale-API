services:
  ticket-service:
    build:
      context: .
      dockerfile: ticket_service/Dockerfile.api
    container_name: ticket-service
    ports:
      - "8000:8000"
    env_file:
      - ./ticket_service/.env
    restart: unless-stopped

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile.auth
    container_name: auth-service
    ports:
      - "8001:8001"
    env_file:
      - ./auth-service/.env
    restart: unless-stopped
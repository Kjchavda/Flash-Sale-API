
events {}

http {
    # Define backend service groups
    upstream auth_backend {
        server auth-service:8001;
    }

    upstream ticket_backend {
        server ticket-service:8000;
    }

    upstream notification_backend {
        server notification-service:8002;
    }

    server {
        listen 80;
        server_name localhost;

        # Auth service
        location /auth/ {
            proxy_pass http://auth_backend/;
        }

        # Ticket service
        location /tickets/ {
            proxy_pass http://ticket_backend/;
        }

        # Notification service
        location /notifications/ {
            proxy_pass http://notification_backend/;
        }

        # Gateway health check
        location = / {
            default_type text/plain;
            return 200 "Flash Sale API Gateway is running\n";
        }
    }
}
